name: CI

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  engine:
    uses: ./.github/workflows/sub-store-engine.yml

  test:
    needs: engine
    timeout-minutes: 60
    env:
      PYTHONUTF8: '1'
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - os: macos-15
            runtime: darwin-arm64
            platform: macos
            arch: aarch64
          - os: windows-2022
            runtime: win-x64
            platform: windows
            arch: x86_64
          - os: ubuntu-22.04
            runtime: linux-x64
            platform: linux
            arch: x86_64
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev patchelf lsof
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.18.0'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.100.0'
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
        with:
          arch: amd64
      - name: Configure Windows test linker
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $linker = Join-Path $env:VCToolsInstallDir 'bin/Hostx64/x64/link.exe'
          if (-not (Test-Path $linker)) { throw "Missing MSVC test linker: $linker" }
          "CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER=$linker" >> $env:GITHUB_ENV
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install dependencies
        run: ./scripts/ci.sh install
      - uses: actions/download-artifact@v4
        with:
          name: sub-store-engine
          path: .cache/cloud-tools-20261121/runtime
      - name: Prepare verified host service runtime
        run: |
          node scripts/sub-store/prepare-runtime.cjs --target '${{ matrix.runtime }}'
          python scripts/validate-sub-store-resources.py src-tauri/resources/sub-store '${{ matrix.arch }}' --platform '${{ matrix.platform }}'
      - name: Frontend checks
        run: ./scripts/ci.sh check-web
      - name: Rust tests
        run: ./scripts/ci.sh check-rust
      - name: Resource and Windows script fixtures
        run: ./scripts/ci.sh check-resources
      - name: Secret scan
        run: ./scripts/ci.sh scan
