name: Android build

on:
  workflow_call:
    inputs:
      release:
        type: boolean
        default: false
      engine_artifact:
        description: Shared engine from the calling release workflow
        type: string
        default: ''
    secrets:
      ANDROID_KEYSTORE_BASE64:
        required: false
      ANDROID_STORE_PASSWORD:
        required: false
      ANDROID_KEY_ALIAS:
        required: false
      ANDROID_KEY_PASSWORD:
        required: false
      ANDROID_CERT_SHA256:
        required: false
  workflow_dispatch:
    inputs:
      release:
        description: Build signed release artifacts (does not publish)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}-${{ inputs.release }}
  cancel-in-progress: false

jobs:
  engine:
    uses: ./.github/workflows/sub-store-engine.yml
    with:
      reuse_artifact: ${{ inputs.engine_artifact || '' }}

  runtime:
    needs: engine
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: android-arm64
            arch: aarch64
          - target: android-x64
            arch: x86_64
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.18.0'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.engine_artifact || 'sub-store-engine' }}
          path: .cache/cloud-tools-20261121/runtime
      - name: Read pinned runtime artifact identity
        id: runtime
        env:
          RUNTIME_TARGET: ${{ matrix.target }}
        run: |
          node -e 'const l=require("./scripts/sub-store/android-runtime-artifacts-lock.json");console.log("sha256="+l.targets[process.env.RUNTIME_TARGET].sha256)' >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: .cache/sub-store-android-artifacts
          key: android-node-${{ matrix.target }}-${{ steps.runtime.outputs.sha256 }}
      - name: Prepare and validate pinned Android Node runtime
        run: |
          node scripts/sub-store/android-runtime-artifact.cjs prepare --target '${{ matrix.target }}'
          node scripts/sub-store/android-runtime-artifact.cjs verify --target '${{ matrix.target }}'
          python3 scripts/validate-sub-store-resources.py src-tauri/resources/sub-store '${{ matrix.arch }}' --platform android
          tar -cf "$RUNNER_TEMP/${{ matrix.target }}.tar" -C src-tauri/resources/sub-store '${{ matrix.target }}'
      - uses: actions/upload-artifact@v4
        with:
          name: runtime-${{ matrix.target }}
          retention-days: 3
          if-no-files-found: error
          path: ${{ runner.temp }}/${{ matrix.target }}.tar

  build:
    needs: runtime
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    env:
      LC_ALL: C
      CARGO_BUILD_JOBS: '2'
      BUILD_MODE: ${{ inputs.release && 'release' || 'debug' }}
      PPCLASH_ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
      PPCLASH_ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      PPCLASH_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      PPCLASH_ANDROID_CERT_SHA256: ${{ inputs.release && secrets.ANDROID_CERT_SHA256 || '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.18.0'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare and verify release signing
        if: inputs.release
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          for field in KEYSTORE_BASE64 PPCLASH_ANDROID_STORE_PASSWORD PPCLASH_ANDROID_KEY_ALIAS PPCLASH_ANDROID_KEY_PASSWORD PPCLASH_ANDROID_CERT_SHA256; do
            if [[ -z "${!field}" ]]; then echo "Missing Android signing secret: $field" >&2; exit 1; fi
          done
          umask 077
          export PPCLASH_ANDROID_KEYSTORE="$RUNNER_TEMP/android-release.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$PPCLASH_ANDROID_KEYSTORE"
          node scripts/check-android-signing.mjs
          echo "PPCLASH_ANDROID_KEYSTORE=$PPCLASH_ANDROID_KEYSTORE" >> "$GITHUB_ENV"
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.4'
          cache-dependency-path: src-tauri/android-core/go.sum
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.100.0'
          targets: aarch64-linux-android,x86_64-linux-android
      - uses: android-actions/setup-android@v3
        with:
          # The action's default also requests the retired SDK "tools" package.
          packages: platform-tools
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev patchelf
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;28.2.13676358'
      - uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.engine_artifact || 'sub-store-engine' }}
          path: .cache/cloud-tools-20261121/runtime
      - uses: actions/download-artifact@v4
        with:
          pattern: runtime-android-*
          merge-multiple: true
          path: .cache/android-node-artifacts
      - name: Prepare verified Android service resources
        run: |
          node scripts/sub-store/prepare-runtime.cjs --shared-only
          for target in android-arm64 android-x64; do
            tar -xf ".cache/android-node-artifacts/$target.tar" -C src-tauri/resources/sub-store
          done
          python3 scripts/validate-sub-store-resources.py src-tauri/resources/sub-store aarch64 --platform android
          python3 scripts/validate-sub-store-resources.py src-tauri/resources/sub-store x86_64 --platform android
      - run: npm ci
      - name: Build and verify Android artifacts
        run: bash scripts/build-android.sh "$BUILD_MODE"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.release && 'installer-android' || 'android-debug' }}
          retention-days: 14
          if-no-files-found: error
          path: |
            .cache/android-build/dist/${{ env.BUILD_MODE }}/*.apk
            .cache/android-build/dist/${{ env.BUILD_MODE }}/*.aab
      - name: Remove signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/android-release.jks"
