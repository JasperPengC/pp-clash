name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publish_release:
        description: '明确授权发布 GitHub Release（须选择匹配版本的 v 标签；默认仅构建）'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.18.0'
      - name: Validate application version and release reference
        env:
          RELEASE_REF: ${{ github.ref }}
          PUBLISH_RELEASE: ${{ inputs.publish_release || false }}
        run: |
          node scripts/check-version.mjs
          VERSION="$(node -p "require('./package.json').version")"
          python3 scripts/validate-release.py ref --version "$VERSION" --ref "$RELEASE_REF" --publish "$PUBLISH_RELEASE"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.4'
          cache: false
      - name: Check source and workflow gates before starting builders
        run: ./scripts/ci.sh preflight
      - name: Verify Android signing before starting builders
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          PPCLASH_ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          PPCLASH_ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          PPCLASH_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          PPCLASH_ANDROID_CERT_SHA256: ${{ secrets.ANDROID_CERT_SHA256 }}
        run: |
          set -euo pipefail
          for field in KEYSTORE_BASE64 PPCLASH_ANDROID_STORE_PASSWORD PPCLASH_ANDROID_KEY_ALIAS PPCLASH_ANDROID_KEY_PASSWORD PPCLASH_ANDROID_CERT_SHA256; do
            if [[ -z "${!field}" ]]; then echo "Missing Android signing secret: $field" >&2; exit 1; fi
          done
          export PPCLASH_ANDROID_KEYSTORE="$RUNNER_TEMP/android-preflight.jks"
          trap 'rm -f "$PPCLASH_ANDROID_KEYSTORE"' EXIT
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$PPCLASH_ANDROID_KEYSTORE"
          node scripts/check-android-signing.mjs

  checks:
    needs: preflight
    uses: ./.github/workflows/ci.yml

  desktop:
    needs: checks
    timeout-minutes: 120
    env:
      PYTHONUTF8: '1'
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - os: macos
            runner: macos-15-intel
            target: x86_64-apple-darwin
            arch: x86_64
            runtime: darwin-x64
          - os: macos
            runner: macos-15
            target: aarch64-apple-darwin
            arch: aarch64
            runtime: darwin-arm64
          - os: windows
            runner: windows-2022
            target: x86_64-pc-windows-msvc
            arch: x86_64
            runtime: win-x64
          - os: windows
            runner: windows-2022
            target: aarch64-pc-windows-msvc
            arch: aarch64
            runtime: win-arm64
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.18.0'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.100.0'
          targets: ${{ matrix.target }}
      - uses: ilammy/msvc-dev-cmd@v1
        if: matrix.os == 'windows'
        with:
          arch: ${{ matrix.arch == 'aarch64' && 'amd64_arm64' || 'amd64' }}
      - name: Configure Windows compilers and linkers
        if: matrix.os == 'windows'
        shell: pwsh
        env:
          MSVC_ARCH: ${{ matrix.arch }}
        run: |
          $hostLinker = Join-Path $env:VCToolsInstallDir 'bin/Hostx64/x64/link.exe'
          if (-not (Test-Path $hostLinker)) { throw "Missing MSVC host linker: $hostLinker" }
          "CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER=$hostLinker" >> $env:GITHUB_ENV
          if ($env:MSVC_ARCH -eq 'aarch64') {
            $armLinker = Join-Path $env:VCToolsInstallDir 'bin/Hostx64/arm64/link.exe'
            if (-not (Test-Path $armLinker)) { throw "Missing MSVC ARM64 linker: $armLinker" }
            "CARGO_TARGET_AARCH64_PC_WINDOWS_MSVC_LINKER=$armLinker" >> $env:GITHUB_ENV
            $clang = @(
              (Get-Command clang.exe -ErrorAction SilentlyContinue | Select-Object -ExpandProperty Source -First 1),
              (Join-Path $env:ProgramFiles 'LLVM/bin/clang.exe'),
              (Join-Path $env:VCINSTALLDIR 'Tools/Llvm/x64/bin/clang.exe')
            ) | Where-Object { $_ -and (Test-Path $_) } | Select-Object -First 1
            if (-not $clang) { throw 'Windows ARM64 requires Clang to compile ring; install the Visual C++ Clang component.' }
            "CC_aarch64_pc_windows_msvc=$clang" >> $env:GITHUB_ENV
          }
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare verified matching kernel
        run: python scripts/prepare-resources.py '${{ matrix.os }}' '${{ matrix.arch }}'
      - uses: actions/download-artifact@v4
        with:
          name: sub-store-engine
          path: .cache/cloud-tools-20261121/runtime
      - name: Prepare verified matching service runtime
        run: |
          node scripts/sub-store/prepare-runtime.cjs --target '${{ matrix.runtime }}'
          python scripts/validate-sub-store-resources.py src-tauri/resources/sub-store '${{ matrix.arch }}' --platform '${{ matrix.os }}'
      - name: Build installer
        env:
          RELEASE_TARGET: ${{ matrix.target }}
          MACOS_TARGET: ${{ matrix.target }}
        run: |
          export KERNEL_ZIP_SHA256="$(cat src-tauri/resources/kernel.zip.sha256)"
          ./scripts/ci.sh build-${{ matrix.os }}-release
      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.os }}-${{ matrix.arch }}
          retention-days: 14
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/dmg/PP_Clash-*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/PP_Clash-*.exe

  linux:
    needs: checks
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            arch: x86_64
            runtime: linux-x64
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            arch: aarch64
            runtime: linux-arm64
    runs-on: ${{ matrix.runner }}
    # 两种架构使用相同 glibc 2.35 基线，避免 ARM 包只能在 Ubuntu 24.04 启动。
    container: ubuntu:22.04
    env:
      DEBIAN_FRONTEND: noninteractive
      APPIMAGE_EXTRACT_AND_RUN: '1'
    steps:
      - name: Install Linux build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates curl git build-essential pkg-config libssl-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev patchelf file wget python3 rpm libcap2-bin lsof
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.18.0'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.100.0'
          targets: ${{ matrix.target }}
      - name: Prepare verified matching kernel
        run: python3 scripts/prepare-resources.py linux '${{ matrix.arch }}'
      - uses: actions/download-artifact@v4
        with:
          name: sub-store-engine
          path: .cache/cloud-tools-20261121/runtime
      - name: Prepare verified matching service runtime
        run: |
          node scripts/sub-store/prepare-runtime.cjs --target '${{ matrix.runtime }}'
          python3 scripts/validate-sub-store-resources.py src-tauri/resources/sub-store '${{ matrix.arch }}' --platform linux
      - name: Build deb, rpm and AppImage
        env:
          RELEASE_TARGET: ${{ matrix.target }}
        run: |
          export KERNEL_ZIP_SHA256="$(cat src-tauri/resources/kernel.zip.sha256)"
          ./scripts/ci.sh build-linux-release
      - uses: actions/upload-artifact@v4
        with:
          name: installer-linux-${{ matrix.arch }}
          retention-days: 14
          if-no-files-found: error
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/deb/PP_Clash-*.deb
            src-tauri/target/${{ matrix.target }}/release/bundle/rpm/PP_Clash-*.rpm
            src-tauri/target/${{ matrix.target }}/release/bundle/appimage/PP_Clash-*.AppImage

  android:
    needs: checks
    uses: ./.github/workflows/android.yml
    with:
      release: true
      engine_artifact: sub-store-engine
    secrets:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      ANDROID_CERT_SHA256: ${{ secrets.ANDROID_CERT_SHA256 }}

  verify-artifacts:
    needs: [desktop, linux, android]
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.18.0'
      - uses: actions/download-artifact@v4
        with:
          pattern: installer-*
          path: artifacts
          merge-multiple: true
      - name: Verify complete matching package set
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          python3 scripts/validate-release.py files --version "$VERSION" --directory artifacts --android
      - uses: actions/upload-artifact@v4
        with:
          name: release-checksums
          path: artifacts/SHA256SUMS
          retention-days: 14
          if-no-files-found: error

  publish:
    needs: verify-artifacts
    if: startsWith(github.ref, 'refs/tags/v') && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish_release))
    permissions:
      contents: write
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: installer-*
          path: artifacts
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: release-checksums
          path: artifacts
      - name: Publish explicitly authorized release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          python3 scripts/validate-release.py files --version "$VERSION" --directory artifacts --android --verify-checksums
          (cd artifacts && sha256sum --check SHA256SUMS)
          gh release create "$GITHUB_REF_NAME" artifacts/* --verify-tag --title "PP Clash $GITHUB_REF_NAME" --notes-file scripts/release-notes.md
